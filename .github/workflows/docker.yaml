name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before pushing images
      run: |
        echo "Before pushing images"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Login to Aliyun registry
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

    - name: Build and push image Aliyun
      run: |
        # 说明：不再使用 easimon/maximize-build-space。
        # 新版 ubuntu-latest（Ubuntu 26.04）是 145G 单盘、没有独立 /mnt，
        # 该 action 会生成 92G 的 /pv.img 和 2G 的 /mnt/tmp-pv.img，全部落在 / 上，
        # 把根分区占满到只剩 100M，docker pull 立刻 No space left on device，
        # 连 runner 自己的日志都写不下去（表现为任务失败、日志为空）。
        set -uo pipefail

        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                 if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        failed_images=()
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            echo "docker pull $line"
            pulled=0
            for attempt in 1 2 3; do
                # 不加大引号：需要保留 "--platform=linux/amd64 镜像名" 这种写法
                # shellcheck disable=SC2086
                if docker pull $line; then
                    pulled=1
                    break
                fi
                echo "拉取失败（第 $attempt 次），10 秒后重试…"
                sleep 10
            done
            if [ "$pulled" -ne 1 ]; then
                echo "::error::镜像拉取失败：$line"
                failed_images+=("$line")
                continue
            fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
               if [[ -n "$name_space" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "docker tag $image $new_image"
            docker tag $image "$new_image"
            echo "docker push $new_image"
            if ! docker push "$new_image"; then
                echo "::error::镜像推送失败：$new_image"
                failed_images+=("$line")
            fi
            docker rmi $image >/dev/null 2>&1 || true
            docker rmi "$new_image" >/dev/null 2>&1 || true
            df -h /
        done < images.txt

        if (( ${#failed_images[@]} > 0 )); then
            echo "以下镜像转存失败（共 ${#failed_images[@]} 个）："
            printf '  - %s\n' "${failed_images[@]}"
            exit 1
        fi
        echo "全部镜像转存完成"
